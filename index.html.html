<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>動滋牧場 FitFarm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    .pixel-font { font-family: 'Press Start 2P', monospace, sans-serif; }
    canvas { image-rendering: pixelated; image-rendering: crisp-edges; }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 16px); }
  </style>
</head>
<body class="bg-amber-50 text-slate-800 font-sans min-h-screen pb-24 select-none">

  <!-- 頂部資訊列 (適配手機頂部) -->
  <header class="bg-emerald-600 text-white shadow-md px-4 py-3 sticky top-0 z-50">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <div class="flex items-center gap-1.5">
        <span class="text-xl">🌾</span>
        <h1 class="text-base font-bold tracking-wide">FitFarm</h1>
      </div>
      <div class="flex items-center gap-2">
        <div class="bg-emerald-800/90 px-2.5 py-1 rounded-full flex items-center gap-1 border border-amber-300">
          <span class="text-sm">🪙</span>
          <span id="gold-display" class="font-bold text-amber-300 pixel-font text-xs">0</span>
        </div>
        <button id="btn-next-day" class="bg-amber-400 hover:bg-amber-300 active:scale-95 text-emerald-950 font-bold px-2.5 py-1 rounded-xl shadow text-xs transition">
          ☀️ 新一天
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-3 space-y-4">

    <!-- 牧場草地畫布與背包快選 -->
    <section class="bg-white rounded-2xl p-3 shadow-sm border border-emerald-100 space-y-2.5">
      <div class="flex justify-between items-center px-1">
        <span class="font-bold text-xs text-emerald-800 flex items-center gap-1.5">
          🐾 牧場草地
          <span id="farm-day-badge" class="bg-emerald-100 text-emerald-700 text-[10px] px-1.5 py-0.2 rounded-full">第 1 天</span>
        </span>
        <span id="animal-count-badge" class="text-[11px] text-slate-500">0 隻動物</span>
      </div>

      <!-- 飼料背包列 (手機橫向滑動) -->
      <div class="bg-amber-100/60 p-2 rounded-xl flex items-center gap-1.5 overflow-x-auto text-[11px] border border-amber-200 scrollbar-none">
        <span class="font-bold text-amber-900 shrink-0">🎒</span>
        <div id="feed-inventory-bar" class="flex gap-1.5 items-center shrink-0"></div>
      </div>

      <!-- 像素畫布：支援觸控點擊 -->
      <div class="relative w-full aspect-[4/3] bg-emerald-300 rounded-xl overflow-hidden border-2 border-emerald-500 shadow-inner">
        <canvas id="farmCanvas" class="w-full h-full block touch-none"></canvas>
      </div>
      <p class="text-[10px] text-center text-slate-400">💡 點擊幼崽餵食飼料，點擊成獸冒愛心互動！</p>
    </section>

    <!-- 1. 打卡頁 -->
    <section id="tab-checkin" class="tab-content space-y-3">
      <!-- 步數 -->
      <div class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm space-y-2">
        <div class="flex items-center gap-2.5">
          <div class="text-2xl bg-amber-100 p-1.5 rounded-xl">👟</div>
          <div>
            <h3 class="font-bold text-sm">每日步數</h3>
            <p class="text-[11px] text-slate-500">每千步 +10 🪙，達 8,000 步加贈 50 🪙</p>
          </div>
        </div>
        <div class="flex gap-2">
          <input id="input-steps" type="number" inputmode="numeric" placeholder="輸入今日步數" class="flex-1 bg-slate-50 border border-slate-200 px-3 py-2 rounded-xl text-sm focus:outline-emerald-500">
          <button id="btn-sync-steps" class="bg-emerald-500 active:scale-95 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow">結算</button>
        </div>
        <div id="steps-status" class="text-[11px] text-emerald-600 font-medium">今日已結算：0 步</div>
      </div>

      <!-- 喝水 -->
      <div class="bg-white p-3.5 rounded-2xl border border-emerald-100 shadow-sm space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="text-2xl bg-sky-100 p-1.5 rounded-xl">💧</div>
            <div>
              <h3 class="font-bold text-sm">補充水分</h3>
              <p class="text-[11px] text-slate-500">每杯 +5 🪙，滿 2000ml 加贈 30 🪙</p>
            </div>
          </div>
          <span id="water-text" class="text-xs font-bold text-sky-600">0 / 2000 ml</span>
        </div>
        <div class="w-full bg-slate-100 h-2 rounded-full overflow-hidden">
          <div id="water-bar" class="bg-sky-400 h-full w-0 transition-all duration-300"></div>
        </div>
        <button id="btn-add-water" class="w-full bg-sky-500 active:scale-95 text-white font-bold py-2.5 rounded-xl text-xs transition shadow">
          + 喝一杯水 (250ml)
        </button>
      </div>

      <!-- 單鍵任務列表 -->
      <div class="grid grid-cols-1 gap-2.5">
        <div class="bg-white p-3 rounded-2xl border border-emerald-100 shadow-sm flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="text-2xl bg-rose-100 p-1 rounded-xl">🏋️</div>
            <div>
              <h3 class="font-bold text-xs">健身重訓課</h3>
              <p class="text-[10px] text-slate-400">每日 1 次 (+80 🪙)</p>
            </div>
          </div>
          <button id="btn-workout" class="bg-rose-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow">打卡</button>
        </div>

        <div class="bg-white p-3 rounded-2xl border border-emerald-100 shadow-sm flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="text-2xl bg-purple-100 p-1 rounded-xl">🧘</div>
            <div>
              <h3 class="font-bold text-xs">瑜珈伸展課</h3>
              <p class="text-[10px] text-slate-400">每日 1 次 (+50 🪙)</p>
            </div>
          </div>
          <button id="btn-yoga" class="bg-purple-500 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow">打卡</button>
        </div>

        <div class="bg-white p-3 rounded-2xl border border-emerald-100 shadow-sm flex items-center justify-between">
          <div class="flex items-center gap-2.5">
            <div class="text-2xl bg-amber-100 p-1 rounded-xl">💩</div>
            <div>
              <h3 class="font-bold text-xs">腸胃順暢打卡</h3>
              <p class="text-[10px] text-slate-400">每日 1 次 (+40 🪙)</p>
            </div>
          </div>
          <button id="btn-poop" class="bg-amber-600 active:scale-95 text-white font-bold px-3 py-1.5 rounded-xl text-xs transition shadow">打卡</button>
        </div>
      </div>
    </section>

    <!-- 2. 繁育所頁 -->
    <section id="tab-nursery" class="tab-content hidden space-y-3">
      <div class="bg-white rounded-2xl p-4 border border-emerald-100 shadow-sm">
        <h2 class="font-bold text-emerald-900 text-sm mb-1">🐣 繁育育幼所</h2>
        <p class="text-[11px] text-slate-500 mb-3">成獸滿 2 隻即可花費半價繁育。幼崽餵食可加速成熟！</p>
        <div id="breeding-container" class="space-y-2.5"></div>
      </div>
    </section>

    <!-- 3. 飼料商店頁 -->
    <section id="tab-feed-shop" class="tab-content hidden space-y-3">
      <div class="bg-white rounded-2xl p-4 border border-emerald-100 shadow-sm">
        <div class="flex justify-between items-center mb-3">
          <h2 class="font-bold text-emerald-900 text-sm">🌾 飼料市集</h2>
          <button onclick="feedAllAnimals()" class="bg-emerald-500 active:scale-95 text-white text-[11px] font-bold px-2.5 py-1.5 rounded-xl shadow">
            🍽️ 一鍵餵食
          </button>
        </div>
        <div id="feed-shop-container" class="grid grid-cols-2 gap-2.5"></div>
      </div>
    </section>

    <!-- 4. 動物市集頁 -->
    <section id="tab-shop" class="tab-content hidden space-y-3">
      <div class="bg-white rounded-2xl p-4 border border-emerald-100 shadow-sm">
        <h2 class="font-bold text-emerald-900 text-sm mb-3">🛒 動物市集</h2>
        <div id="shop-container" class="grid grid-cols-2 gap-2.5"></div>
      </div>
    </section>

  </main>

  <!-- 手機專用底部導覽列 (Bottom Nav Bar) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur border-t border-emerald-100 px-3 py-2 z-50 safe-bottom">
    <div class="max-w-md mx-auto grid grid-cols-4 gap-1 text-center">
      <button onclick="switchTab('checkin')" id="nav-btn-checkin" class="nav-btn flex flex-col items-center py-1 text-emerald-600 font-bold">
        <span class="text-lg">📋</span>
        <span class="text-[11px]">打卡</span>
      </button>
      <button onclick="switchTab('nursery')" id="nav-btn-nursery" class="nav-btn flex flex-col items-center py-1 text-slate-400">
        <span class="text-lg">🐣</span>
        <span class="text-[11px]">繁育 (<span id="breed-ready-count">0</span>)</span>
      </button>
      <button onclick="switchTab('feed-shop')" id="nav-btn-feed-shop" class="nav-btn flex flex-col items-center py-1 text-slate-400">
        <span class="text-lg">🌾</span>
        <span class="text-[11px]">飼料</span>
      </button>
      <button onclick="switchTab('shop')" id="nav-btn-shop" class="nav-btn flex flex-col items-center py-1 text-slate-400">
        <span class="text-lg">🛒</span>
        <span class="text-[11px]">市集</span>
      </button>
    </div>
  </nav>

  <script>
    const FEEDS = [
      { id: "grain", name: "穀物", emoji: "🌽", price: 10, targetDesc: "雞、豬", targets: ["chicken", "pig"] },
      { id: "hay", name: "牧草", emoji: "🌾", price: 15, targetDesc: "羊、馬、水豚、羊駝", targets: ["sheep", "horse", "capybara", "alpaca"] },
      { id: "fish", name: "小魚", emoji: "🐟", price: 20, targetDesc: "企鵝", targets: ["penguin"] },
      { id: "greens", name: "蔬果", emoji: "🥬", price: 25, targetDesc: "長頸鹿、河馬、象", targets: ["giraffe", "hippo", "elephant"] }
    ];

    const SPECIES = [
      { id: "chicken", name: "雞", emoji: "🐔", buyPrice: 100, breedCost: 50, growthDays: 1, feedType: "grain", color: "#f59e0b", size: 10 },
      { id: "pig", name: "豬", emoji: "🐷", buyPrice: 250, breedCost: 120, growthDays: 2, feedType: "grain", color: "#f472b6", size: 13 },
      { id: "sheep", name: "綿羊", emoji: "🐑", buyPrice: 400, breedCost: 200, growthDays: 2, feedType: "hay", color: "#f8fafc", size: 13 },
      { id: "penguin", name: "企鵝", emoji: "🐧", buyPrice: 600, breedCost: 300, growthDays: 3, feedType: "fish", color: "#1e293b", size: 12 },
      { id: "capybara", name: "水豚", emoji: "🦫", buyPrice: 900, breedCost: 450, growthDays: 3, feedType: "hay", color: "#b45309", size: 14 },
      { id: "alpaca", name: "羊駝", emoji: "🦙", buyPrice: 1200, breedCost: 600, growthDays: 4, feedType: "hay", color: "#f1f5f9", size: 15 },
      { id: "horse", name: "馬", emoji: "🐴", buyPrice: 1800, breedCost: 900, growthDays: 5, feedType: "hay", color: "#854d0e", size: 16 },
      { id: "hippo", name: "河馬", emoji: "🦛", buyPrice: 2500, breedCost: 1200, growthDays: 6, feedType: "greens", color: "#64748b", size: 18 },
      { id: "giraffe", name: "長頸鹿", emoji: "🦒", buyPrice: 3500, breedCost: 1700, growthDays: 7, feedType: "greens", color: "#eab308", size: 20 },
      { id: "elephant", name: "大象", emoji: "🐘", buyPrice: 5000, breedCost: 2500, growthDays: 10, feedType: "greens", color: "#94a3b8", size: 22 }
    ];

    let state = {
      gold: 200,
      day: 1,
      feeds: { grain: 2, hay: 2, fish: 1, greens: 1 },
      animals: [
        { id: "chicken", currentDays: 1, isAdult: true, x: 80, y: 80, vx: 0.5, vy: 0, bounce: 0, heart: 0 }
      ],
      today: { steps: 0, water: 0, workout: false, yoga: false, poop: false }
    };

    function loadState() {
      const saved = localStorage.getItem("fitfarm_save");
      if (saved) {
        try {
          const parsed = JSON.parse(saved);
          state = { ...state, ...parsed };
          if (!state.feeds) state.feeds = { grain: 0, hay: 0, fish: 0, greens: 0 };
          state.animals.forEach(a => {
            if (!a.x) a.x = Math.random() * 200 + 40;
            if (!a.y) a.y = Math.random() * 120 + 40;
            a.vx = (Math.random() - 0.5) * 0.8;
            a.vy = (Math.random() - 0.5) * 0.8;
            a.bounce = 0;
            a.heart = 0;
          });
        } catch(e) { console.error(e); }
      }
    }

    function saveState() {
      localStorage.setItem("fitfarm_save", JSON.stringify(state));
      renderUI();
    }

    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.querySelectorAll('.nav-btn').forEach(el => {
        el.className = "nav-btn flex flex-col items-center py-1 text-slate-400";
      });
      document.getElementById(`tab-${tabId}`).classList.remove('hidden');
      const activeNav = document.getElementById(`nav-btn-${tabId}`);
      activeNav.className = "nav-btn flex flex-col items-center py-1 text-emerald-600 font-bold";
    }

    function renderUI() {
      document.getElementById('gold-display').innerText = state.gold;
      document.getElementById('farm-day-badge').innerText = `第 ${state.day} 天`;
      document.getElementById('animal-count-badge').innerText = `${state.animals.length} 隻動物`;

      document.getElementById('steps-status').innerText = `今日已結算：${state.today.steps} 步`;
      document.getElementById('water-text').innerText = `${state.today.water} / 2000 ml`;
      document.getElementById('water-bar').style.width = `${Math.min(100, (state.today.water / 2000) * 100)}%`;

      setBtnActive('btn-workout', state.today.workout);
      setBtnActive('btn-yoga', state.today.yoga);
      setBtnActive('btn-poop', state.today.poop);

      renderInventoryBar();
      renderFeedShop();
      renderShop();
      renderNursery();
    }

    function setBtnActive(id, isDone) {
      const btn = document.getElementById(id);
      if (isDone) {
        btn.disabled = true;
        btn.innerText = "已完成 ✓";
        btn.classList.add('opacity-40', 'pointer-events-none');
      } else {
        btn.disabled = false;
        btn.classList.remove('opacity-40', 'pointer-events-none');
        btn.innerText = "打卡";
      }
    }

    function renderInventoryBar() {
      const bar = document.getElementById('feed-inventory-bar');
      bar.innerHTML = FEEDS.map(f => `
        <div class="bg-white px-2 py-0.5 rounded-lg border border-amber-200 flex items-center gap-1 font-medium whitespace-nowrap">
          <span>${f.emoji}</span>
          <span>${f.name}:</span>
          <b class="text-amber-700">${state.feeds[f.id] || 0}</b>
        </div>
      `).join('');
    }

    function renderFeedShop() {
      const container = document.getElementById('feed-shop-container');
      container.innerHTML = FEEDS.map(f => `
        <div class="border border-emerald-100 p-2.5 rounded-xl bg-emerald-50/40 flex flex-col justify-between">
          <div>
            <div class="text-xl">${f.emoji}</div>
            <div class="font-bold text-xs text-slate-800">${f.name}</div>
            <div class="text-[10px] text-emerald-700 font-semibold">🪙 ${f.price}</div>
            <div class="text-[9px] text-slate-400 mt-1">${f.targetDesc}</div>
          </div>
          <button onclick="buyFeed('${f.id}')" ${state.gold < f.price ? 'disabled' : ''} class="mt-2 w-full py-1 rounded-lg font-bold text-[11px] shadow transition active:scale-95 ${state.gold >= f.price ? 'bg-amber-400 text-amber-950' : 'bg-slate-200 text-slate-400'}">
            購買
          </button>
        </div>
      `).join('');
    }

    function buyFeed(feedId) {
      const f = FEEDS.find(item => item.id === feedId);
      if (state.gold >= f.price) {
        state.gold -= f.price;
        state.feeds[feedId] = (state.feeds[feedId] || 0) + 1;
        saveState();
      }
    }

    function feedSingleAnimal(animal) {
      const s = SPECIES.find(item => item.id === animal.id);
      const feedType = s.feedType;
      if (state.feeds[feedType] > 0) {
        state.feeds[feedType]--;
        animal.bounce = 15;
        animal.heart = 40;
        if (!animal.isAdult) {
          animal.currentDays++;
          if (animal.currentDays >= s.growthDays) animal.isAdult = true;
        }
        saveState();
      } else {
        const feedInfo = FEEDS.find(f => f.id === feedType);
        alert(`需要【${feedInfo.name} ${feedInfo.emoji}】，請前往飼料市集購買！`);
      }
    }

    function feedAllAnimals() {
      let fedCount = 0;
      state.animals.forEach(a => {
        if (!a.isAdult) {
          const s = SPECIES.find(item => item.id === a.id);
          if (state.feeds[s.feedType] > 0) {
            state.feeds[s.feedType]--;
            a.currentDays++;
            a.bounce = 12;
            a.heart = 30;
            if (a.currentDays >= s.growthDays) a.isAdult = true;
            fedCount++;
          }
        }
      });
      if (fedCount > 0) saveState();
      else alert("目前沒有幼崽需要餵食或飼料不足！");
    }

    function renderShop() {
      const container = document.getElementById('shop-container');
      container.innerHTML = SPECIES.map(s => {
        const feedInfo = FEEDS.find(f => f.id === s.feedType);
        return `
          <div class="border border-emerald-100 p-2.5 rounded-xl flex flex-col justify-between bg-emerald-50/40">
            <div>
              <div class="text-2xl">${s.emoji}</div>
              <div class="font-bold text-xs text-slate-800">${s.name} (幼崽)</div>
              <div class="text-[10px] text-slate-400">吃：${feedInfo.emoji} ${feedInfo.name}</div>
              <div class="text-[10px] text-slate-400">成熟：${s.growthDays}天</div>
            </div>
            <button onclick="buyAnimal('${s.id}')" ${state.gold < s.buyPrice ? 'disabled' : ''} class="mt-2 w-full py-1 rounded-lg font-bold text-[11px] shadow transition active:scale-95 ${state.gold >= s.buyPrice ? 'bg-amber-400 text-amber-950' : 'bg-slate-200 text-slate-400'}">
              🪙 ${s.buyPrice}
            </button>
          </div>
        `;
      }).join('');
    }

    function buyAnimal(speciesId) {
      const s = SPECIES.find(item => item.id === speciesId);
      if (state.gold >= s.buyPrice) {
        state.gold -= s.buyPrice;
        state.animals.push({
          id: s.id,
          currentDays: 0,
          isAdult: false,
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          bounce: 12,
          heart: 30
        });
        saveState();
      }
    }

    function renderNursery() {
      const container = document.getElementById('breeding-container');
      let readyBreeds = 0;

      container.innerHTML = SPECIES.map(s => {
        const owned = state.animals.filter(a => a.id === s.id);
        const adults = owned.filter(a => a.isAdult).length;
        const babies = owned.filter(a => !a.isAdult).length;
        const canBreed = adults >= 2 && state.gold >= s.breedCost;
        if (adults >= 2) readyBreeds++;

        return `
          <div class="border border-emerald-100 p-2.5 rounded-xl bg-white shadow-xs flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-2xl">${s.emoji}</span>
              <div>
                <div class="font-bold text-xs text-slate-800">${s.name}</div>
                <div class="text-[10px] text-slate-500">成:${adults} | 幼:${babies}</div>
              </div>
            </div>
            <button onclick="breedAnimal('${s.id}')" ${!canBreed ? 'disabled' : ''} class="px-2.5 py-1 rounded-lg font-bold text-[11px] shadow transition active:scale-95 ${canBreed ? 'bg-pink-500 text-white' : 'bg-slate-100 text-slate-400 border'}">
              ❤️ 繁育 (🪙${s.breedCost})
            </button>
          </div>
        `;
      }).join('');

      document.getElementById('breed-ready-count').innerText = readyBreeds;
    }

    function breedAnimal(speciesId) {
      const s = SPECIES.find(item => item.id === speciesId);
      const adults = state.animals.filter(a => a.id === speciesId && a.isAdult);
      if (adults.length >= 2 && state.gold >= s.breedCost) {
        state.gold -= s.breedCost;
        state.animals.push({
          id: s.id,
          currentDays: 0,
          isAdult: false,
          x: canvas.width / 2 + (Math.random() * 20 - 10),
          y: canvas.height / 2 + (Math.random() * 20 - 10),
          vx: (Math.random() - 0.5) * 0.8,
          vy: (Math.random() - 0.5) * 0.8,
          bounce: 15,
          heart: 50
        });
        saveState();
      }
    }

    // 打卡邏輯
    document.getElementById('btn-sync-steps').addEventListener('click', () => {
      const input = document.getElementById('input-steps');
      const val = parseInt(input.value) || 0;
      if (val > state.today.steps) {
        const diff = val - state.today.steps;
        const stepGold = Math.floor(diff / 1000) * 10;
        let bonus = 0;
        if (state.today.steps < 8000 && val >= 8000) bonus = 50;
        state.gold += (stepGold + bonus);
        state.today.steps = val;
        input.value = '';
        saveState();
      }
    });

    document.getElementById('btn-add-water').addEventListener('click', () => {
      state.today.water += 250;
      state.gold += 5;
      if (state.today.water >= 2000 && state.today.water - 250 < 2000) state.gold += 30;
      saveState();
    });

    document.getElementById('btn-workout').addEventListener('click', () => {
      if (!state.today.workout) {
        state.today.workout = true;
        state.gold += 80;
        saveState();
      }
    });

    document.getElementById('btn-yoga').addEventListener('click', () => {
      if (!state.today.yoga) {
        state.today.yoga = true;
        state.gold += 50;
        saveState();
      }
    });

    document.getElementById('btn-poop').addEventListener('click', () => {
      if (!state.today.poop) {
        state.today.poop = true;
        state.gold += 40;
        saveState();
      }
    });

    document.getElementById('btn-next-day').addEventListener('click', () => {
      state.day += 1;
      state.today = { steps: 0, water: 0, workout: false, yoga: false, poop: false };
      state.animals.forEach(a => {
        const s = SPECIES.find(item => item.id === a.id);
        a.currentDays += 1;
        if (a.currentDays >= s.growthDays) a.isAdult = true;
      });
      saveState();
    });

    // ==========================================
    // 觸控優化像素 Canvas
    // ==========================================
    const canvas = document.getElementById('farmCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 320;
    canvas.height = 240;

    function handleInteraction(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const clickX = (clientX - rect.left) * (canvas.width / rect.width);
      const clickY = (clientY - rect.top) * (canvas.height / rect.height);

      let handled = false;
      state.animals.forEach(a => {
        const s = SPECIES.find(item => item.id === a.id);
        const sz = a.isAdult ? s.size : s.size * 0.65;
        if (Math.hypot(a.x - clickX, a.y - clickY) < sz + 12 && !handled) {
          handled = true;
          if (!a.isAdult) feedSingleAnimal(a);
          else {
            a.bounce = 12;
            a.heart = 30;
          }
        }
      });
    }

    // 支援手機觸控與滑鼠點擊
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      const touch = e.touches[0];
      handleInteraction(touch.clientX, touch.clientY);
    }, { passive: false });

    canvas.addEventListener('click', (e) => {
      handleInteraction(e.clientX, e.clientY);
    });

    function drawPixelAnimal(ctx, a) {
      const s = SPECIES.find(item => item.id === a.id);
      const scale = a.isAdult ? 1 : 0.65;
      const bY = -Math.abs(Math.sin(a.bounce * 0.3) * (a.bounce > 0 ? 6 : 0));

      ctx.save();
      ctx.translate(Math.round(a.x), Math.round(a.y + bY));
      if (a.vx < 0) ctx.scale(-1, 1);

      ctx.fillStyle = "rgba(16, 85, 40, 0.25)";
      ctx.beginPath();
      ctx.ellipse(0, 4 * scale, 7 * scale, 3 * scale, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = s.color;
      const w = s.size * scale;
      const h = (s.size * 0.8) * scale;
      ctx.fillRect(-w/2, -h, w, h);

      ctx.fillStyle = "#000000";
      ctx.fillRect(w/4, -h + 2 * scale, 1.5 * scale, 2 * scale);
      ctx.fillStyle = "#fb7185";
      ctx.fillRect(w/4 - 1 * scale, -h + 4 * scale, 2 * scale, 1.5 * scale);

      if (!a.isAdult) {
        ctx.fillStyle = "#84cc16";
        ctx.fillRect(-1, -h - 4, 2, 4);
        ctx.fillRect(-3, -h - 4, 2, 2);
      }

      ctx.restore();

      if (a.heart > 0) {
        ctx.fillStyle = "#f43f5e";
        ctx.font = "10px monospace";
        ctx.fillText("❤️", a.x - 4, a.y - s.size - (40 - a.heart) * 0.4);
        a.heart--;
      }
    }

    function loop() {
      ctx.fillStyle = "#6ee7b7";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#34d399";
      for (let i = 15; i < canvas.width; i += 40) {
        for (let j = 15; j < canvas.height; j += 35) {
          ctx.fillRect(i, j, 2, 3);
          ctx.fillRect(i + 2, j - 1, 2, 4);
        }
      }

      state.animals.forEach(a => {
        a.x += a.vx;
        a.y += a.vy;

        if (a.x < 20) { a.x = 20; a.vx *= -1; }
        if (a.x > canvas.width - 20) { a.x = canvas.width - 20; a.vx *= -1; }
        if (a.y < 30) { a.y = 30; a.vy *= -1; }
        if (a.y > canvas.height - 20) { a.y = canvas.height - 20; a.vy *= -1; }

        if (Math.random() < 0.015) {
          a.vx = (Math.random() - 0.5) * 0.8;
          a.vy = (Math.random() - 0.5) * 0.8;
        }

        if (a.bounce > 0) a.bounce--;
        drawPixelAnimal(ctx, a);
      });

      requestAnimationFrame(loop);
    }

    loadState();
    renderUI();
    loop();
  </script>
</body>
</html>
